services:
  app:
    build: .
    container_name: SWUDB_app
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    environment:
      - DB_HOST=db
      - DB_DATABASE=my_swudb
      - DB_USERNAME=swudb
      - DB_PASSWORD=
    networks:
      internal:
        ipv4_address: 172.23.0.10
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: SWUDB_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    networks:
      - internal
      - proxy
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.SWUDB.rule=Host(`unlimiteddb.mandich.dev`)"
      - "traefik.http.routers.SWUDB.entrypoints=websecure"
      - "traefik.http.routers.SWUDB.tls.certresolver=letsencrypt"
      - "traefik.http.services.SWUDB.loadbalancer.server.port=80"

  db:
    image: mariadb:11
    container_name: SWUDB_db
    restart: unless-stopped
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=unlimiteddb
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: .
    container_name: unlimiteddb_worker
    restart: unless-stopped
    command: php artisan queue:work --max-time=3600
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    environment:
      - DB_HOST=db
      - DB_DATABASE=unlimiteddb
      - DB_USERNAME=unlimiteddb
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      internal:
        ipv4_address: 172.23.0.11
    depends_on:
      db:
        condition: service_healthy

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
  proxy:
    external: true

volumes:
  db_data:
